name: pre-commit
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
    - features/**
  pull_request:
    branches:
    - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install development dependencies
      run: uv sync --locked --group dev
    - name: Run pre-commit
      run: uv run --locked --no-sync pre-commit run --all-files
